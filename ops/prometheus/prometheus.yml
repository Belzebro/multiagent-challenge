# Perfil `observability` de docker-compose: Prometheus recoge /metrics de la API cada 15 s.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: getnet-api
    metrics_path: /metrics
    # Con METRICS_TOKEN en la API, añadir:  authorization: {credentials: "<token>"}
    static_configs:
      - targets: ["api:8000"]
