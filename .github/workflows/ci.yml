name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint y tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Sin secretos versionados
        run: |
          if git grep -nIE 'gsk_[A-Za-z0-9]{20,}'; then
            echo "::error::Hay una clave de Groq en el repositorio"
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.txt

      - name: Dependencias (torch CPU y versiones fijadas)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0
          pip install -r requirements.lock -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest

  docker:
    name: Imagen Docker y smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: getnet-multiagent-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test del contenedor
        run: |
          docker run -d --name api -p 8000:8000 -e GROQ_API_KEY=ci-dummy-key \
            -e JWT_SECRET=ci-only-secret-0123456789abcdef0123456789 getnet-multiagent-api:ci
          for _ in $(seq 1 36); do
            status=$(docker inspect -f '{{.State.Health.Status}}' api)
            echo "health: $status"
            [ "$status" = "healthy" ] && break
            sleep 5
          done
          docker logs api 2>&1 | grep -v Batches | tail -n 20
          test "$(docker inspect -f '{{.State.Health.Status}}' api)" = "healthy"
          post() {  # $1 = cabecera de autorización, $2 = cuerpo JSON
            curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8000/chat \
              -H 'Content-Type: application/json' -H "$1" -d "$2"
          }
          token=$(docker exec api python scripts/issue_token.py --sub ci-user)
          code=$(post "X-No-Auth: 1" '{"message": "hola", "user_id": "ci-user"}')
          echo "sin token -> $code"; test "$code" = "401"
          code=$(post "Authorization: Bearer $token" '{"message": "hola", "user_id": "otro-usuario"}')
          echo "user_id distinto del token -> $code"; test "$code" = "403"
          code=$(post "Authorization: Bearer $token" '{"message": "", "user_id": "ci-user"}')
          echo "mensaje vacío con token -> $code"; test "$code" = "422"
